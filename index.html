<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Track spending, budgets and investments across all your devices" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="icon" href="/expense_tracker/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/expense_tracker/apple-touch-icon-180x180.png" />
    <title>Expense Tracker</title>
    <script>
      // Apply the saved theme before first paint so there's no flash
      try {
        const t = localStorage.getItem('theme');
        const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
